# Локальный профиль линтера. Без него ruff в этой среде стартует с полным
# набором правил и заваливает вывод шумом (BLE001, S110, ...), маскируя
# реальные ошибки класса F/E.
target-version = "py313"

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Импорты проекта идут после sys.path.insert(ROOT) — запуск без установки
# пакета и из любого каталога.
"main.py" = ["E402"]
"tests/**" = ["E402"]
