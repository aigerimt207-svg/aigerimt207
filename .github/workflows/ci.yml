# FastBid GosZakup — CI: линт + тесты (GitHub Actions).
# UI-тесты требуют Tk: запускаем под xvfb (в безголовой среде они пропущены бы).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff (check, UP041, format)
        run: |
          python -m ruff check .
          python -m ruff check --select UP041 .
          python -m ruff format --check .
      - name: Tests (xvfb — Tk для UI-тестов)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run -a python -m pytest tests/ -q
